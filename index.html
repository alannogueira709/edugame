<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroBeep</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/addons/p5.sound.min.js"></script>
  <link rel="stylesheet" type="text/css" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="assets/icon-vector.svg">
  <link rel="alternate icon" type="image/png" href="assets/icon.png">
  <link rel="stylesheet" type="text/css" href="game-styles.css">
</head>
<body>
  <div id="p5-container"></div>

  <div class="content-overlay" style="display: none;">
      <section class="landing-hero">
        <div class="logo-container">
          <div class="logo-halo"></div>
          <svg class="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color: hsl(193, 95%, 73%); stop-opacity: 1" />
                <stop offset="100%" style="stop-color: hsl(198, 100%, 82%); stop-opacity: 1" />
              </linearGradient>
            </defs>
            <circle cx="100" cy="100" r="95" fill="none" stroke="url(#logoGradient)" stroke-width="2" opacity="0.5"/>
            <image href="assets/icon-vector.svg" x="20" y="20" width="160" height="160" />
          </svg>
        </div>

        <img src="assets/title-neurobeep.png" alt="NeuroBeep" class="title-neurobeep">
      </section>

      <div class="buttons-container">
        <button class="btn-play" type="button">
          <span aria-hidden="true">&#9654;</span>
          Jogar
        </button>
        <button class="btn-info" type="button">
          <span aria-hidden="true">&#9432;</span>
          Como jogar
        </button>
      </div>

      <div class="footer">
        <img src="assets/ufrn.png" alt="UFRN" class="ufrn-footer-logo">
        <img src="assets/ufpe.png" alt="UFPE" class="ufpe-footer-logo">
      </div>
  </div>

  <div class="modal-backdrop hidden" id="instructions-modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="instructions-title">
      <button class="modal-close" type="button" data-close-modal aria-label="Fechar instrucoes">
        &#10005;
      </button>

      <h2 id="instructions-title">Como jogar</h2>

      <div class="modal-steps">
        <article class="modal-step">
          <span class="modal-step-index">1</span>
          <p>Escute a pergunta e olhe as letras.</p>
        </article>
        <article class="modal-step">
          <span class="modal-step-index">2</span>
          <p><strong>RELAXE</strong> para o robo andar. <strong>CONCENTRE</strong> para parar.</p>
        </article>
        <article class="modal-step">
          <span class="modal-step-index">3</span>
          <p>Escute o feedback e continue!</p>
        </article>
      </div>

      <button class="modal-cta" type="button" data-close-modal>Ok</button>
    </div>
  </div>

  <script type="module" src="sketch.js"></script>
</body>
</html>
